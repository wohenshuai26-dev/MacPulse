name: MacPulse
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  # Generates the number symbols (62°, 38%, …) used by the Control Center controls.
  preGenCommand: swift tools/make_symbols.swift Controls/Assets.xcassets
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    PROVISIONING_PROFILE_SPECIFIER: ""
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    ENABLE_HARDENED_RUNTIME: YES
    GENERATE_INFOPLIST_FILE: NO
targets:
  MacPulse:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
      - path: Common
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MP_BUNDLE_PREFIX).MacPulse
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/MacPulse.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: App/MacPulse-Bridging-Header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: MacPulseControls
        embed: true
      - target: MacPulseFanHelper
        embed: true
        codeSign: true
        copy:
          destination: executables
    postBuildScripts:
      - name: Fan helper launchd plist
        basedOnDependencyAnalysis: false
        script: |
          LABEL="${MP_BUNDLE_PREFIX}.MacPulse.FanHelper"
          DIR="${TARGET_BUILD_DIR}/${CONTENTS_FOLDER_PATH}/Library/LaunchDaemons"
          mkdir -p "$DIR"
          cat > "$DIR/$LABEL.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>Label</key><string>$LABEL</string>
            <key>BundleProgram</key><string>Contents/MacOS/MacPulseFanHelper</string>
            <key>MachServices</key><dict><key>$LABEL</key><true/></dict>
            <key>AssociatedBundleIdentifiers</key><array><string>${MP_BUNDLE_PREFIX}.MacPulse</string></array>
          </dict>
          </plist>
          PLIST
  MacPulseControls:
    type: app-extension
    platform: macOS
    sources:
      - path: Controls
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(MP_BUNDLE_PREFIX).MacPulse.Controls
        INFOPLIST_FILE: Controls/Info.plist
        CODE_SIGN_ENTITLEMENTS: Controls/MacPulseControls.entitlements
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
  MacPulseFanHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
      - path: Common
      - path: App/MPSensors.c
    settings:
      base:
        PRODUCT_NAME: MacPulseFanHelper
        PRODUCT_BUNDLE_IDENTIFIER: $(MP_BUNDLE_PREFIX).MacPulse.FanHelper
        INFOPLIST_FILE: Helper/Info.plist
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SWIFT_OBJC_BRIDGING_HEADER: App/MacPulse-Bridging-Header.h
        SKIP_INSTALL: YES
